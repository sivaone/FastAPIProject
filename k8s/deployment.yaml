apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-service-account
  labels:
    app: fastapi-project

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-project
  template:
    metadata:
      labels:
        app: fastapi-project
    spec:
      serviceAccountName: fastapi-service-account
      containers:
        - name: fastapi-container
          image: fastapi-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  labels:
    app: fastapi-project
spec:
  selector:
    app: fastapi-project
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-ingress
  labels:
    app: fastapi-project
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: fastapi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
